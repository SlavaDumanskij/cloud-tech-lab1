user root;
events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;
    limit_req_status 429;

    upstream backend_cluster {
        server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:8002 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name app.local localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name app.local localhost;

        ssl_certificate /data/data/com.termux/files/home/cloud-tech-lab1/certs/nginx.crt;
        ssl_certificate_key /data/data/com.termux/files/home/cloud-tech-lab1/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /data/data/com.termux/files/home/cloud-tech-lab1/static;
        index index.html;

        error_page 404 /404.html;
        location = /404.html {
            internal;
            root /data/data/com.termux/files/home/cloud-tech-lab1/static;
        }

        location / {
            try_files $uri $uri/ /404.html;
        }

        location /docs/ {
            alias /data/data/com.termux/files/home/cloud-tech-lab1/docs/;
            index index.html;
        }

        location /api/ {
            limit_req zone=api_limit burst=3 nodelay;

            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }

        location /admin/ {
            auth_basic "Restricted Area";
            auth_basic_user_file /data/data/com.termux/files/home/cloud-tech-lab1/.htpasswd;
            alias /data/data/com.termux/files/home/cloud-tech-lab1/admin_panel/;
            index index.html;
        }
    }

    server {
        listen 443 ssl;
        server_name extra.local;

        ssl_certificate /data/data/com.termux/files/home/cloud-tech-lab1/certs/nginx.crt;
        ssl_certificate_key /data/data/com.termux/files/home/cloud-tech-lab1/certs/nginx.key;

        root /data/data/com.termux/files/home/cloud-tech-lab1/second_domain;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
